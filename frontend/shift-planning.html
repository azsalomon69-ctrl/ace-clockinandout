<!doctype html><html lang="en"><head><base href="/"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shift planning · ACE Clock</title><link rel="icon" href="assets/images/ace-logo.png"><link rel="stylesheet" href="css/app.css"><link rel="stylesheet" href="css/shift-planning.css"></head><body class="planning-page"><div class="planning-wrap"><header class="planning-header"><a id="planningHome" class="planning-brand" href="/user-dashboard"><img src="assets/images/ace-logo.png" alt="ACE" width="42" height="42"><span>ACE Clock<small>Shifts</small></span></a><div class="planning-account"><label><span class="sr-only">Appearance</span><select id="planningTheme" class="form-select" aria-label="Appearance"><option value="light">Light</option><option value="dark">Dark</option><option value="system">System</option></select></label><a id="planningBack" class="btn btn-outline" href="/user-dashboard">Dashboard</a></div></header><main><header class="planning-heading"><div><p class="admin-section-kicker">SCHEDULE</p><h1 id="planningTitle">Shift planning</h1><p id="planningSubtitle">Prepare shifts, then publish them to employees.</p></div><div class="planning-heading-actions"><button id="planningSettings" class="btn btn-outline" hidden>Planning limits</button><button id="planningRefresh" class="btn btn-outline">Refresh</button></div></header><p id="planningError" class="planning-message" role="alert" hidden></p><p id="planningWarning" class="planning-message planning-warning" role="status" hidden></p><section class="planning-toolbar" aria-label="Planning controls"><label id="planningProjectField"><span>Project / campaign</span><select id="planningProject" class="form-select"><option value="">Choose a project</option></select></label><div class="planning-week-nav"><button id="planningPrevious" class="btn btn-outline" aria-label="Previous week"><img src="assets/icons/chevron-left.svg" alt=""></button><label><span id="planningDateLabel">Week of</span><input id="planningDate" class="form-input" type="date" data-calendar-label="Week of"></label><button id="planningNext" class="btn btn-outline" aria-label="Next week"><img src="assets/icons/chevron-right.svg" alt=""></button><button id="planningToday" class="btn btn-outline">Today</button></div><div class="planning-view-switch" aria-label="Board view"><button id="planningWeek" class="is-active" aria-pressed="true">Week</button><button id="planningDay" aria-pressed="false">Day</button></div></section><div class="planning-actions" id="plannerActions" hidden><div class="planning-template-strip" id="planningTemplates"></div><div><button class="btn btn-outline" id="planningTemplateAdd">New template</button><button class="btn btn-outline" id="planningCopy">Copy to next week</button><button class="btn btn-primary" id="planningPublish" disabled>Publish week</button></div></div><section id="planningReview" class="planning-review" hidden><div><strong>Membership changes need review</strong><p id="planningReviewText"></p></div><button id="planningCancelReview" class="btn btn-outline">Cancel affected shifts</button></section><section id="planningContent" class="planning-content" aria-busy="true"><div class="planning-skeleton" aria-hidden="true"></div></section><section id="planningAvailability" class="planning-panel" hidden><header><div><h2>My availability</h2><p>Let your manager know when you can work.</p></div><button id="planningAvailabilityAdd" class="btn btn-primary">Add availability</button></header><div id="planningAvailabilityList"></div></section><section id="planningNotifications" class="planning-panel" hidden><header><h2>Shift updates</h2><button id="planningMarkRead" class="btn btn-outline">Mark as read</button></header><div id="planningNotificationList"></div></section></main><footer class="planning-footer">Times shown in Philippine time · Asia/Manila</footer></div><dialog id="planningDialog" class="planning-dialog"></dialog><dialog id="planningConfirm"
