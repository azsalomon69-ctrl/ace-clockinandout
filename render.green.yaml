# Green release candidate only. Apply as a NEW Blueprint, using this file
# on codex/green-deployment. Do not replace or sync Blue's Blueprint.
# This shares production Supabase: it is NOT an isolated mutation-test environment.
# Confirm generated URLs and Supabase OAuth redirects before acceptance.
services:
  - type: web
    name: ace-clock-api-green
    runtime: node
    repo: https://github.com/azsalomon69-ctrl/ace-clockinandout
    branch: codex/green-deployment
    region: singapore
    plan: free
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm test && npm run test:security
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://aceclock-green.onrender.com
      - key: SUPABASE_URL
        fromService:
          name: ace-clockinandout
          type: web
          envVarKey: SUPABASE_URL
      - key: SUPABASE_SECRET_KEY
        fromService:
          name: ace-clockinandout
          type: web
          envVarKey: SUPABASE_SECRET_KEY
      - key: SUPABASE_PUBLISHABLE_KEY
        fromService:
          name: ace-clockinandout
          type: web
          envVarKey: SUPABASE_PUBLISHABLE_KEY
      - key: HEAD_ADMIN_EMAIL
        fromService:
          name: ace-clockinandout
          type: web
          envVarKey: HEAD_ADMIN_EMAIL
      - key: CLOUDINARY_API_KEY
        fromService:
          name: ace-clockinandout
          type: web
          envVarKey: CLOUDINARY_API_KEY
      - key: CLOUDINARY_API_SECRET
        fromService:
          name: ace-clockinandout
          type: web
          envVarKey: CLOUDINARY_API_SECRET
      - key: CLOUDINARY_CLOUD_NAME
        fromService:
          name: ace-clockinandout
          type: web
          envVarKey: CLOUDINARY_CLOUD_NAME
      - key: GMAIL_CLIENT_ID
        fromService:
          name: ace-clockinandout
          type: web
          envVarKey: GMAIL_CLIENT_ID
      - key: GMAIL_CLIENT_SECRET
        fromService:
          name: ace-clockinandout
          type: web
          envVarKey: GMAIL_CLIENT_SECRET
      - key: GMAIL_FROM
        fromService:
          name: ace-clockinandout
          type: web
          envVarKey: GMAIL_FROM
      - key: GMAIL_REFRESH_TOKEN
        fromService:
          name: ace-clockinandout
          type: web
          envVarKey: GMAIL_REFRESH_TOKEN
      - key: INVITE_REDIRECT_URL
        fromService:
          name: ace-clockinandout
          type: web
          envVarKey: INVITE_REDIRECT_URL

  - type: web
    name: aceclock-green
    runtime: static
    repo: https://github.com/azsalomon69-ctrl/ace-clockinandout
    branch: codex/green-deployment
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm test && npm run test:security && npm run build
    staticPublishPath: dist
    envVars:
      - key: ACE_API_URL
        fromService:
          name: ace-clock-api-green
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; connect-src 'self' https://ace-clock-api-green.onrender.com https://*.supabase.co https://api.cloudinary.com; font-src 'self' data: https://fonts.gstatic.com; manifest-src 'self'; worker-src 'none'; upgrade-insecure-requests"
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - path: /*
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
